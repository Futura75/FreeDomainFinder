name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  secrets:
    # Blocks the build if any credential is committed, in the diff or anywhere
    # in history. The repo is public: a leaked key is a leaked key forever.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: a secret can hide in old commits

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .gitleaks.toml is auto-detected at the repo root

  build:
    runs-on: ubuntu-latest
    needs: secrets

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test + coverage
        run: npm run coverage

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info

      - name: Build
        run: npm run build
        env:
          # Avoid failing on missing AI keys at build time (they're only used at runtime).
          GROQ_API_KEY: dummy-build-time-key
